name: zepp-notifier

services:
  relay:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: zepp-notify-relay:1.0
    command: ["--host", "0.0.0.0", "--port", "8097",
              "--state", "/data/state.json", "--log", "/data/events.jsonl"]
    # Token as a plain variable (simplest with Dockhand). The secrets-file
    # alternative still works — see docs/hosting.md — but pick one: an env
    # value here plus a missing secret file would crash the relay at startup
    # (an unreadable token file is fatal, by design).
    environment:
      - RELAY_TOKEN=${RELAY_TOKEN}
      # Dashboard login (browser remembers it per session). It is the only credential a
      # human needs: page, /state, app management and the test-notify box all accept it,
      # so the operator token never has to be looked up. API tokens for senders, apps and
      # the watch are unaffected. Leave unset for an open dashboard (token field shown).
      - DASHBOARD_USER=${DASHBOARD_USER:-}
      - DASHBOARD_PASS=${DASHBOARD_PASS:-}
    volumes:
      # /data IS the delivery contract: queue, idempotency fingerprints, app
      # registry, fact log. Host-path bind, must be set, e.g.
      # /opt/docker/zepp-relay. Must be writable by uid 65534 (the image runs
      # as nobody): chown 65534:65534 or equivalent. :z relabels for SELinux.
      # Empty it and a sender retry becomes a duplicate. Back it up.
      - type: bind
        source: ${HOST_DATA_DIR}
        target: /data
        bind:
          create_host_path: true
    ports:
      # Loopback only; TLS terminates at the reverse proxy, which forwards
      # Authorization through. See docs/hosting.md. (Harmless to keep alongside
      # the internal network; drop it if the proxy reaches the relay by name.)
      - "127.0.0.1:${RELAY_PORT:-8097}:8097"
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8097/health', timeout=3).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3


# (No top-level volumes: /data is a host-path bind, configured above.)

networks:
  # Your existing internal network (the one the reverse proxy is on), by name:
  #   INTERNAL_NETWORK=homelab-net
  # Unset it and the relay just uses the default bridge. The proxy then reaches
  # the relay as http://relay:8097 from inside this network.
  internal:
    name: ${INTERNAL_NETWORK:-bridge}
    external: true
